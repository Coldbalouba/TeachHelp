<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeachHelp - AI Lesson Generator</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/icon.png" alt="TeachHelp" class="app-icon">
            <h1>TeachHelp</h1>
            <p class="subtitle">AI-Powered Lesson Plan Generator</p>
        </header>
        
        <main>
            <div class="input-section">
                <div class="input-group">
                    <label for="apiKey">Gemini API Key:</label>
                    <input 
                        type="password" 
                        id="apiKey" 
                        placeholder="Enter your Gemini API key"
                        autocomplete="off"
                    >
                    <small>Your API key is stored locally and never sent to our servers</small>
                </div>
                
                <div class="input-group">
                    <label>Model Order:</label>
                    <div class="model-order">
                        <div class="model-order-row">
                            <span class="model-rank">1st</span>
                            <select id="modelSelect" class="model-select" data-rank="0"></select>
                        </div>
                        <div class="model-order-row">
                            <span class="model-rank">2nd</span>
                            <select id="modelSelect2" class="model-select" data-rank="1"></select>
                        </div>
                        <div class="model-order-row">
                            <span class="model-rank">3rd</span>
                            <select id="modelSelect3" class="model-select" data-rank="2"></select>
                        </div>
                    </div>
                    <small>Choose which model is tried first, second and third. If one is unavailable or out of quota, the next one is used. Your order is saved.</small>
                </div>
                
                <div class="input-group">
                    <label for="lessonPrompt">Lesson Description:</label>
                    <textarea 
                        id="lessonPrompt" 
                        rows="6" 
                        placeholder="Describe your lesson topic, learning objectives, grade level, or any specific requirements. For example: 'Create a lesson plan about photosynthesis for 5th grade students covering the process, importance, and key components.'"
                    ></textarea>
                </div>
                
                <button id="generateBtn" class="generate-btn">
                    <span class="btn-text">Generate Lesson</span>
                    <span class="btn-loader" style="display: none;">⏳ Generating...</span>
                </button>
            </div>
            
            <div id="statusMessage" class="status-message" style="display: none;"></div>
        </main>
        <footer class="credit">
            Made with ❤️ by <strong>AJ (Ahmed Jouini)</strong>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
